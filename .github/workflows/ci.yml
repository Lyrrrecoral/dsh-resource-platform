name: smoke
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          find packages -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: UI smoke
        run: node packages/resource-allocation-ui/smoke/bundle-smoke.mjs
